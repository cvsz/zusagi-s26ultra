name: Android APK
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: 8.14.5
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Compile Android instrumentation tests
        working-directory: android
        run: gradle :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: zeaz-ultimate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
